    <li class="nav-item" role="presentation">

    <div class="tab-pane fade" id="refrigerantes-pane" role="tabpanel" aria-labelledby="refrigerantes-tab" tabindex="0">

        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2" *ngFor="let obj of listaRefrigerantes">

    <div class="tab-pane fade" id="padaria-pane" role="tabpanel" aria-labelledby="padaria-tab" tabindex="0">

        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2" *ngFor="let obj of listaPadarias">

    <div class="tab-pane fade" id="higiene-pane" role="tabpanel" aria-labelledby="higiene-tab" tabindex="0">

        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2" *ngFor="let obj of listaHigienePessoal">
          <ng-container *ngTemplateOutlet="cardProduto; context: { $implicit: obj }"></ng-container>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="limpeza-pane" role="tabpanel" aria-labelledby="limpeza-tab" tabindex="0">
      <div class="row g-3 justify-content-center m-0">
        <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2" *ngFor="let obj of listaProdutosLimpeza">
          <ng-container *ngTemplateOutlet="cardProduto; context: { $implicit: obj }"></ng-container>

      </div>
    </div>

  </div>
</div>

<ng-template #cardProduto let-obj>
  <div class="card h-100 text-center p-3 shadow-sm mx-auto" style="border-radius: 12px; border: 1px solid #eee; max-width: 300px;">
    <img [src]="'/' + ($any(obj).imagem || obj.codigo) + '.jpg'" class="card-img-top mx-auto" style="height: 160px; object-fit: contain;" [alt]="obj.nome">
    <div class="card-body d-flex flex-column p-0 mt-3">
      <h6 class="card-title fw-bold mb-3" style="font-size: 0.95rem;">{{obj.nome}}</h6>
      <div class="mt-auto">
        <span class="text-muted text-decoration-line-through d-block mb-1" style="font-size: 0.85rem;" *ngIf="obj.valorPromo > 0">R$ {{obj.valor}}</span>
        <span class="text-success fw-bold fs-5 d-block mb-3">R$ {{obj.valorPromo > 0 ? obj.valorPromo : obj.valor}}</span>
        <div class="controle d-flex justify-content-center gap-2">
          <a [routerLink]="['/detalhes', obj.codigo]" [state]="{ produto: obj }" class="btn btn-outline-secondary w-50 detalhe d-flex align-items-center justify-content-center gap-1 text-decoration-none" style="font-size: 0.85rem;">
            <i class="fa-solid fa-magnifying-glass"></i> Detalhe
          </a>
          <button (click)="adicionarAoCarrinho(obj)" class="btn btn-success w-50 compra d-flex align-items-center justify-content-center gap-1" style="font-size: 0.85rem;" *ngIf="obj.quantidade > 0">
            <i class="fa-solid fa-cart-plus"></i> Comprar
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<div class="background">
    <div class="translucido">
        <div class="caixa-branca">
            <img src="gif/clubPenguin.gif" alt="" width="110px">
            <h3>Crie uma nova senha</h3>

            @if (!concluido) {
                <p align="center">Digite e confirme sua nova senha de acesso.</p>
                <form (ngSubmit)="redefinir()">
                    <label for="novaSenha">Nova senha</label><br>
                    <input id="novaSenha" name="novaSenha" type="password" [(ngModel)]="novaSenha" minlength="6" required [disabled]="!token"><br>

                    <label for="confirmarSenha">Confirme a nova senha</label><br>
                    <input id="confirmarSenha" name="confirmarSenha" type="password" [(ngModel)]="confirmarSenha" minlength="6" required [disabled]="!token"><br>

                    @if (mensagem) {
                        <div class="alert mt-2" [class.alert-danger]="erro" [class.alert-success]="!erro">{{ mensagem }}</div>
                    }

                    <button type="submit" [disabled]="enviando || !token">
                        {{ enviando ? 'Salvando...' : 'Salvar nova senha' }}
                    </button>
                    <a routerLink="/recuperarSenha"><button type="button" class="voltar">Solicitar novo link</button></a>
                </form>
            } @else {
                <div class="alert alert-success mt-2">{{ mensagem }}</div>
                <a routerLink="/login"><button type="button">Ir para o login</button></a>
            }

            <br><br>
            <img src="indentidades/skyfallGroup2.png" alt="Logo Skyfall Group" width="200px">
        </div>
    </div>
</div>
